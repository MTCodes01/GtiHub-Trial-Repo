name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for the Commit Overflow event!
  - type: input
    id: title
    attributes:
      label: Title
      description: A clear and concise title for the feature request.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected Behaviour
      description: How should this feature work in practice?
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Easy
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Commit Overflow Category
      options:
        - Frontend
        - Backend
        - DevOps
        - Design
        - General
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues for similar feature requests.
          required: true
        - label: I have read the `CONTRIBUTING.md` guidelines.
          required: true
