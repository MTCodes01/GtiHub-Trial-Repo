name: Custom Issue
description: Report an issue that doesn't fit into the other categories
title: "[Custom]: "
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for opening an issue. Please provide as much detail as possible.
  - type: input
    id: title
    attributes:
      label: Title
      description: A clear and concise title.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe your issue in detail.
    validations:
      required: true
  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected Behaviour (Optional)
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other relevant context here.
    validations:
      required: false
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Easy
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Commit Overflow Category
      options:
        - General
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues.
          required: true
