name: Improvement
description: Propose a general enhancement or improvement to existing code
title: "[Improvement]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement for our codebase!
  - type: input
    id: title
    attributes:
      label: Title
      description: A clear and concise title for the improvement.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the current state and why does it need improvement?
    validations:
      required: true
  - type: textarea
    id: expected_behaviour
    attributes:
      label: Expected Behaviour
      description: What is the proposed solution or improvement?
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, benchmarks, or code snippets here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues.
          required: true
